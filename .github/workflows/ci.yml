name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo; don't inherit whatever the org default is.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Type check (backend)
        run: npx tsc --noEmit

      # The root tsconfig excludes packages/client, so it needs its own flat
      # pass — local node_modules symlinks hide breakage that only shows here.
      - name: Type check (client)
        working-directory: packages/client
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # Gateway route tests drive the real Hono app against real Postgres +
      # Qdrant + MinIO. Same command as the documented local flow, so the two
      # can't drift.
      - name: Start test stack and build test schema
        run: bun run test:setup

      - name: Test
        run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build all packages
        run: bun run build

  # Advisory only, deliberately outside the `check` gate: the tree currently
  # carries high advisories whose fixes need out-of-range bumps (vite 6 -> 7,
  # drizzle-orm 0.38 -> 0.45, react-router -> 7.18). Fold this into `check`'s
  # `needs` once those land, so it becomes blocking.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # Resolves against bun.lock alone — no install needed.
      - name: Security audit
        run: bun audit --audit-level=high

  # Single required status check (branch ruleset on main requires `check`).
  # Adding gates above must not add required checks here, or PRs deadlock —
  # this job aggregates them into the one name the ruleset knows about.
  check:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build]
    if: always()
    steps:
      - name: Verify every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a quality gate did not succeed ($RESULTS)"
              exit 1
            fi
          done
