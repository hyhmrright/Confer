name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo; don't inherit whatever the org default is.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Lint
        run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup

      - name: Type check (backend)
        run: npx tsc --noEmit

      # The root tsconfig excludes packages/client, so it needs its own flat
      # pass — local node_modules symlinks hide breakage that only shows here.
      - name: Type check (client)
        working-directory: packages/client
        run: npx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup

      # Gateway route tests drive the real Hono app against real Postgres +
      # Qdrant + MinIO. Same command as the documented local flow, so the two
      # can't drift.
      - name: Start test stack and build test schema
        run: bun run test:setup

      - name: Test
        run: bun run test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Build all packages
        run: bun run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      #
      # GHSA-qwww-vcr4-c8h2 (react-router RSC-mode CSRF) is ignored, not
      # unfixed: it needs react-router 8, which peers on React >=19.2.7 while
      # the client is on React 18 — a whole-client framework migration. The
      # vulnerable path is RSC mode with router actions, and the client is a
      # Tauri SPA using only BrowserRouter/Routes/Route/Navigate/useNavigate,
      # so it cannot reach that code. Drop the flag when the client moves to
      # React 19; do not add IDs here without recording why they're unreachable.
      - name: Security audit
        run: bun audit --audit-level=high --ignore=GHSA-qwww-vcr4-c8h2

  # Single required status check (branch ruleset on main requires `check`).
  # Adding gates above must not add required checks here, or PRs deadlock —
  # this job aggregates them into the one name the ruleset knows about.
  check:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, build, audit]
    if: always()
    steps:
      - name: Verify every gate passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a quality gate did not succeed ($RESULTS)"
              exit 1
            fi
          done
