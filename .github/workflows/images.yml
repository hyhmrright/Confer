name: Images

# Publishes the gateway and client images to GHCR so first contact costs a pull
# instead of a build. CI deliberately does not run docker build (see the note in
# CLAUDE.md about what a green check does and doesn't cover) — this workflow is
# where the Dockerfiles actually get exercised, on every push to main.
#
# It runs on main and tags only, never on pull_request, so it can never become a
# status check: the ruleset on main requires `check` and nothing else, and a new
# required context would deadlock every PR.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # One job per image per architecture, on native runners. The alternative —
  # a single job with platforms: linux/amd64,linux/arm64 — emulates through
  # QEMU, and the client image brotli-compresses its whole dist at -11, which
  # under emulation turns a two-minute build into a twenty-minute one.
  build:
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: gateway
            dockerfile: infra/gateway.Dockerfile
          - name: client
            dockerfile: infra/client.Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push by digest only. The tags are attached later, once both
      # architectures exist, so a half-published manifest can never be `latest`.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          # The base images float (oven/bun:1, alpine), and a cached layer is
          # exactly how a breaking Bun release stayed invisible for thirteen
          # days. Always resolve the base fresh here.
          pull: true
          outputs: type=image,name=${{ env.REGISTRY }}/${{ github.repository_owner }}/confer-${{ matrix.image.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.platform.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins each image's two per-arch digests into one multi-arch manifest and
  # puts the human-readable tags on that.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: [gateway, client]
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/confer-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/confer-${{ matrix.image }}
        run: |
          tags=()
          while IFS= read -r tag; do
            tags+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")

          # One file per architecture, each named after the digest it produced.
          refs=()
          for digest in *; do
            refs+=("${IMAGE}@sha256:${digest}")
          done

          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Verify the published manifest covers both architectures
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository_owner }}/confer-${{ matrix.image }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | (index("amd64") and index("arm64"))' \
            > /dev/null
