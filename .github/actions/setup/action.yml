name: Setup
description: Install Bun, restore the dependency cache, and install workspace deps.

runs:
  using: composite
  steps:
    # Pinned, and the single place CI's Bun version is declared — `latest`
    # lets an upstream Bun release turn CI red with no change of ours.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: '1.3.14'

    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
