# Security response headers, included by every location in nginx.conf that sets
# an add_header of its own.
#
# The repetition is not redundancy: nginx's add_header does NOT merge across
# levels — a location that declares any add_header silently discards every one
# inherited from the server block. `/assets/`, `/fonts/` and `/` each set a
# Cache-Control, so each has to re-include this file or it would serve the app
# shell and its scripts with no headers at all, which is precisely the case that
# matters.
#
# __CSP_SCRIPT_HASHES__ is substituted at image build time by
# infra/client.Dockerfile, from the tokens the locale-preload Vite plugin emits
# for every inline script the build put in the page. Editing or adding one moves
# the hashes on its own; nothing here needs to change.

# Auth tokens live in localStorage (a bearer-token SPA), so script execution is
# the whole ballgame: an injected script reads the token and owns the account.
# `script-src` therefore admits only our own bundle and the named hashes —
# no 'unsafe-inline', no eval, no third-party origin.
#
# 'unsafe-inline' IS required for styles: index.html inlines the first-paint
# colours, and React writes `style` attributes, which style-src governs too.
# There is no token-stealing equivalent for CSS here.
#
# connect-src 'self' covers the API and the same-origin WebSocket — ws:// and
# wss:// to the page's own host match 'self' in every browser we target — and
# denies every other destination, which is what turns a would-be exfiltration
# into a blocked request.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' __CSP_SCRIPT_HASHES__; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:" always;

# frame-ancestors above already refuses framing in every browser we target; this
# is the same answer for anything that only understands the older header.
add_header X-Frame-Options DENY always;

# Stops a browser from second-guessing a Content-Type — the mechanism that turns
# an uploaded or user-supplied file served as text into an executed script.
add_header X-Content-Type-Options nosniff always;

# Referrers leak conversation and document ids in a path. Same-origin keeps the
# full URL for our own navigation and sends nothing outward.
add_header Referrer-Policy same-origin always;

# None of these are used, so none should be grantable — including by an iframe
# this page never intended to host.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# Browsers ignore HSTS delivered over plain http, so this is inert for a
# localhost or LAN install and takes effect exactly where it should: behind
# docker-compose.tls.yml's Caddy. No includeSubDomains — the domain a self-host
# picks may have unrelated siblings we must not speak for.
add_header Strict-Transport-Security "max-age=31536000" always;
