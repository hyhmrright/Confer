server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # See the file itself for why this include is repeated in the locations
    # below rather than being inherited from here.
    include /etc/nginx/security-headers.conf;

    # The image ships a .br and a .gz next to every static file, so serve those
    # rather than recompressing identical bytes per request. Both directives
    # fall back to the plain file when a variant is missing, and both set
    # Content-Encoding and Vary themselves — there is no way for the two to
    # disagree. Brotli lands the login bundle at 91 KB against gzip's 106 KB.
    brotli_static on;
    gzip_static on;

    # Still needed for what has no file on disk: everything proxied to the
    # gateway. nginx defaults gzip to off, which is how the client bundle came
    # to ship at its full 647 KB to every visitor. Level 6 rather than 9
    # because this compresses live API responses, and 9 costs noticeably more
    # CPU on a box that also runs the gateway.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain application/javascript text/css application/json
               image/svg+xml application/manifest+json;
    # text/html is always gzipped and cannot be listed above.

    # Set at http level by this base image too, but stated here so a base image
    # change cannot silently drop it.
    tcp_nopush on;

    location /api/ {
        # Knowledge-base uploads are capped at 10 MB by the route handler. Left
        # at nginx's 1 MB default, anything above that never reached the
        # gateway at all — the browser got a bare nginx 413 page instead of the
        # app's own message, and the handler's limit was dead code.
        client_max_body_size 10m;
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Two API responses here are long-lived and must not be buffered or cut:
        # the SSE chat stream, and the consult long-poll (up to 55s of silence
        # by design). Buffering holds tokens back until a buffer fills, so a
        # reply that is being streamed arrives as one lump; the 60s read
        # timeout then ends anything slower than that. HTTP/1.1 because the
        # 1.0 default sends `Connection: close` upstream and forbids chunked.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location /ws {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /a2a/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
    }

    location /agents/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
    }

    # Vite content-hashes every filename here, so a given URL's bytes can never
    # change — a deploy publishes new names instead. Caching them forever turns
    # every repeat visit from a revalidation round-trip into a local read.
    location /assets/ {
        # Never fall through to the SPA shell here. A cached shell naming an
        # asset a later deploy deleted would otherwise get 200 + HTML, and the
        # browser would try to parse HTML as an ES module — a white screen and
        # `Unexpected token '<'` instead of a legible 404.
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Self-hosted webfonts. Not content-hashed like /assets/, so no `immutable`
    # — the name would be reused if the subset were ever regenerated. A month is
    # long enough that nobody refetches them in practice. woff2 is already
    # brotli-compressed internally, hence absent from gzip_types above and not
    # precompressed in the image either.
    location /fonts/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # This is the one location that serves the app shell, so it is the one
        # where the CSP actually governs anything.
        include /etc/nginx/security-headers.conf;
        # The shell is what names those hashed assets. Cached, it would keep
        # requesting files the last deploy deleted, so it must revalidate —
        # ETag still makes that a 304 in the common case.
        add_header Cache-Control "no-cache";
    }
}
