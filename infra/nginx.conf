server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;

    # nginx defaults gzip to off, so the client bundle shipped at its full
    # 647 KB to every visitor. These types cover everything Vite emits; at
    # level 6 the bundle lands around 195 KB. Level 9 buys ~2 KB more for
    # noticeably more CPU per request, which is the wrong trade for a server
    # that also runs the gateway.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain application/javascript text/css application/json
               image/svg+xml application/manifest+json;
    # text/html is always gzipped and cannot be listed above.

    tcp_nopush on;

    location /api/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /a2a/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /.well-known/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
    }

    location /agents/ {
        proxy_pass http://gateway:3000;
        proxy_set_header Host $host;
    }

    # Vite content-hashes every filename here, so a given URL's bytes can never
    # change — a deploy publishes new names instead. Caching them forever turns
    # every repeat visit from a revalidation round-trip into a local read.
    location /assets/ {
        # Never fall through to the SPA shell here. A cached shell naming an
        # asset a later deploy deleted would otherwise get 200 + HTML, and the
        # browser would try to parse HTML as an ES module — a white screen and
        # `Unexpected token '<'` instead of a legible 404.
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Self-hosted webfonts. Not content-hashed like /assets/, so no `immutable`
    # — the name would be reused if the subset were ever regenerated. A month is
    # long enough that nobody refetches them in practice. Already-compressed
    # woff2, hence deliberately absent from gzip_types above.
    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        # The shell is what names those hashed assets. Cached, it would keep
        # requesting files the last deploy deleted, so it must revalidate —
        # ETag still makes that a 304 in the common case.
        add_header Cache-Control "no-cache";
    }
}
