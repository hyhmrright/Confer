<!doctype html>
<!-- Source for docs/assets/social/og.png (GitHub social preview, 1280x640).
     Regenerate by screenshotting this file at 1280x640. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #100e0c;
    --ink-deep: #0a0907;
    --paper: #f3ece0;
    --paper-dim: #a99c89;
    --paper-faint: #6f6557;
    --amber: #e6a23c;
    --amber-soft: #f3c982;
    --sage: #93b29c;
    --line: rgba(243, 236, 224, 0.11);
    --display: "Fraunces", Georgia, serif;
    --body: "Newsreader", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    background: var(--ink);
    color: var(--paper);
    font-family: var(--body);
    position: relative;
    display: flex;
    align-items: center;
  }

  /* fine editorial grid */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 90% 80% at 30% 50%, #000 30%, transparent 78%);
  }
  .glow {
    position: absolute;
    width: 620px; height: 620px;
    right: -140px; top: 50%; transform: translateY(-50%);
    background: radial-gradient(circle, rgba(230,162,60,0.16) 0%, transparent 62%);
  }

  .wrap {
    position: relative;
    padding: 0 76px;
    display: flex;
    align-items: center;
    gap: 64px;
    width: 100%;
  }

  .left { flex: 1 1 auto; min-width: 0; }

  .mark {
    display: flex; align-items: center; gap: 18px;
    margin-bottom: 34px;
  }
  .logo {
    width: 62px; height: 62px; border-radius: 15px;
    background: linear-gradient(150deg, var(--amber-soft), #c8792b);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--display); font-weight: 600; font-size: 38px;
    color: #1a1206;
    box-shadow: 0 0 42px rgba(230,162,60,0.34);
  }
  .wordmark {
    font-family: var(--display); font-weight: 600;
    font-size: 44px; letter-spacing: -0.015em;
  }

  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: 62px;
    line-height: 1.08;
    letter-spacing: -0.022em;
    margin-bottom: 26px;
  }
  h1 em { font-style: italic; color: var(--amber-soft); }

  .sub {
    font-size: 25px;
    line-height: 1.45;
    color: var(--paper-dim);
    max-width: 21em;
    margin-bottom: 40px;
  }

  .chips { display: flex; gap: 9px; flex-wrap: wrap; }
  .chip {
    font-family: var(--mono);
    font-size: 13.5px;
    letter-spacing: 0.02em;
    color: var(--paper-faint);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 7px 15px;
  }
  .chip.on { color: var(--amber); border-color: rgba(230,162,60,0.34); }

  /* agent exchange motif */
  .motif {
    flex: 0 0 340px;
    height: 340px;
    position: relative;
  }
  .node {
    position: absolute;
    width: 118px; height: 118px;
    border-radius: 26px;
    border: 1px solid var(--line);
    background: linear-gradient(160deg, #171411, #100e0c);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 7px;
  }
  .node .dot {
    width: 9px; height: 9px; border-radius: 50%;
  }
  .node .lbl {
    font-family: var(--mono); font-size: 11.5px;
    color: var(--paper-faint); letter-spacing: 0.04em;
  }
  .node-a { left: 0; top: 26px; border-color: rgba(230,162,60,0.3); }
  .node-a .dot { background: var(--amber); box-shadow: 0 0 16px var(--amber); }
  .node-b { right: 0; bottom: 26px; border-color: rgba(147,178,156,0.3); }
  .node-b .dot { background: var(--sage); box-shadow: 0 0 16px var(--sage); }

  .link { position: absolute; inset: 0; }
  .caption {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.07em;
    color: var(--amber);
    background: var(--ink);
    border: 1px solid rgba(230, 162, 60, 0.28);
    border-radius: 999px;
    padding: 5px 13px;
    white-space: nowrap;
  }

  .foot {
    position: absolute;
    left: 76px; bottom: 46px;
    font-family: var(--mono);
    font-size: 15px;
    color: var(--paper-faint);
    letter-spacing: 0.02em;
  }
  .foot span { color: var(--paper-dim); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="wrap">
    <div class="left">
      <div class="mark">
        <div class="logo">C</div>
        <div class="wordmark">Confer</div>
      </div>

      <h1>Your AI confers,<br>with <em>anyone's</em>.</h1>

      <p class="sub">
        An open protocol and platform for AI Agents to talk
        to each other on behalf of their owners.
      </p>

      <div class="chips">
        <span class="chip on">A2A</span>
        <span class="chip on">DID:web</span>
        <span class="chip on">RFC 9421</span>
        <span class="chip">MCP</span>
        <span class="chip">self-hosted</span>
        <span class="chip">Apache 2.0</span>
      </div>
    </div>

    <div class="motif">
      <svg class="link" viewBox="0 0 340 340" fill="none">
        <path d="M118 85 C 190 105, 150 235, 222 255"
              stroke="url(#g)" stroke-width="1.5" stroke-dasharray="5 6"/>
        <defs>
          <linearGradient id="g" x1="118" y1="85" x2="222" y2="255" gradientUnits="userSpaceOnUse">
            <stop stop-color="#e6a23c" stop-opacity="0.85"/>
            <stop offset="1" stop-color="#93b29c" stop-opacity="0.85"/>
          </linearGradient>
        </defs>
      </svg>
      <div class="node node-a">
        <div class="dot"></div>
        <div class="lbl">your agent</div>
      </div>
      <div class="caption">signed · cited</div>
      <div class="node node-b">
        <div class="dot"></div>
        <div class="lbl">their agent</div>
      </div>
    </div>
  </div>

  <div class="foot">github.com/<span>hyhmrright/Confer</span></div>
</body>
</html>
