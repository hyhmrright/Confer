# Chrome strings + design-doc nav, per language. Consumed by _layouts/default.html.
#
# Doc `file` names are shared across languages (same .html, different directory);
# the layout prefixes them with the language directory (en/ , ja/ , … or "" for zh).
#
# `label` is the language's own name for itself, and is deliberately identical in
# every block — someone who cannot read the interface they are currently in has
# to be able to find their own line. `short` is the one or two characters the
# nav rail shows, in that language's own script for the same reason.
#
# Keys are ordered by total speakers, matching SUPPORTED_LANGUAGES in the client
# (packages/client/src/i18n/index.ts). The layout reads this order, so adding a
# language here is the only edit the docs chrome needs.
en:
  htmllang: en
  dir: ltr
  label: English
  short: EN
  home: Home
  deploy: Deployment
  docslabel: Design docs
  langlabel: Language
  back: Back to Confer
  canonical: "Translated from the Chinese original. Where the two disagree, the original is authoritative."
  footline: "A2A · DID:web · RFC 9421 · NANDA"
  copyright: "© 2026 Confer — open source."
  docs:
    - { file: 01-product.html, name: Product }
    - { file: 02-architecture.html, name: Architecture }
    - { file: 03-protocol.html, name: Protocol }
    - { file: 04-data-model.html, name: Data model }
