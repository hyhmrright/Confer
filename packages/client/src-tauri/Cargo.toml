[package]
name = "confer"
version = "0.7.0"
description = "Confer - Agent-to-Agent Communication Platform"
authors = []
edition = "2021"

[lib]
name = "confer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
sea-query = { version = "0.32", default-features = false, features = ["backend-sqlite", "derive"] }
