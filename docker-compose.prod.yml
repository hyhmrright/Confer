services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: confer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confer}
      POSTGRES_DB: confer
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confer"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.12.0
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-confer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-confer-secret}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  # The three built services name their images explicitly rather than letting
  # compose derive `<project>-<service>`. infra/deploy.sh and infra/rollback.sh
  # read these names straight out of this file, so the tag is a contract now,
  # not an implementation detail of compose's naming rules.
  migrate:
    image: confer-migrate:latest
    build:
      context: .
      dockerfile: infra/gateway.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/packages/gateway
    environment:
      DATABASE_URL: postgres://confer:${POSTGRES_PASSWORD:-confer}@postgres:5432/confer
    command: ["bun", "run", "src/db/migrate.ts"]
    restart: "no"

  # Single instance by design — WebSocket connections, A2A replay nonces and
  # rate-limit counters all live in this process's memory. Adding a replica
  # would silently break A2A replay protection (a replay routed to the other
  # replica finds an empty nonce table). Scaling out requires moving that state
  # to a shared store first; see docs/02-architecture.md.
  gateway:
    image: confer-gateway:latest
    build:
      context: .
      dockerfile: infra/gateway.Dockerfile
    restart: unless-stopped
    # A local model runtime (Ollama, LM Studio) listens on the owner's own
    # machine, and the gateway is what dials it — both to chat and to list the
    # models the settings UI offers. Docker Desktop resolves this name on its
    # own; Linux does not, and without the mapping the owner's only usable
    # address would be a LAN IP that changes.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      # QDRANT_URL below points at this service, so it belongs here — without
      # it, `up -d gateway client` leaves a stopped qdrant stopped and RAG
      # fails silently. It has no healthcheck, so service_started is as strong
      # a condition as we can state; the gateway retries the connection.
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: postgres://confer:${POSTGRES_PASSWORD:-confer}@postgres:5432/confer
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # The address peers reach this instance at. Every DID this gateway mints
      # is derived from it, so it is not cosmetic: leave it at localhost and no
      # other instance can resolve this one's identities. Defaults to the host
      # the client container serves on (port 80), NOT the gateway's own 3000.
      # Set it to your domain — including a non-80 EXPOSE_PORT — before
      # federating. Changing it re-hosts identities minted under the old
      # localhost default; see rehostLegacyDids in bootstrap.ts.
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-confer}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-confer-secret}
      MINIO_BUCKET: knowledge-docs

  client:
    image: confer-client:latest
    build:
      context: .
      dockerfile: infra/client.Dockerfile
    restart: unless-stopped
    ports:
      - "${EXPOSE_PORT:-80}:80"
    depends_on:
      - gateway

volumes:
  pgdata:
  qdrantdata:
  miniodata:
