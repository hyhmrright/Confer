services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: confer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-confer}
      POSTGRES_DB: confer
    # 18 stores its data under a major-versioned subdirectory, so the mount is
    # one level up from the /var/lib/postgresql/data that 16 used. A volume
    # written by 16 is NOT readable either way: the entrypoint detects the old
    # layout at both paths and refuses to start rather than initialising an
    # empty database over it, which is the outcome that matters — the data is
    # still there, and `docker compose logs postgres` says exactly what to do.
    # Moving from 16 means a dump and restore; see docs/09-deployment.md.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confer"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    # Storage written by 1.12 is not readable here either: 1.18 renamed a
    # segment.json variant and the server panics on load rather than migrating
    # it. Vectors are derived data — re-embedding rebuilds them — but the
    # cheaper path is to export the points and upsert them back, which needs no
    # embedding calls at all. Same section of docs/09-deployment.md.
    image: qdrant/qdrant:v1.19.1
    restart: unless-stopped
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    # SILO, PGSTY's maintained fork of MinIO: upstream is archived and its
    # images are gone from Docker Hub and Quay. Same on-disk format and env;
    # digest-pinned because it is a third-party publisher.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-confer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-confer-secret}
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  # The built services name their images explicitly rather than letting compose
  # derive `<project>-<service>`. infra/deploy.sh and infra/rollback.sh read
  # these names straight out of this file, so the tag is a contract now, not an
  # implementation detail of compose's naming rules.
  #
  # migrate and gateway deliberately share one tag, as they always have on the
  # ghcr path. They are built from the same Dockerfile and the same context, so
  # the only thing that ever told the two images apart was how long ago each
  # was last built — which is exactly what went wrong: `deploy.sh` rebuilt
  # `gateway`, left migrate on a month-old image, and migrate then applied the
  # old migration set while still printing "Migrations complete". One tag makes
  # that impossible rather than merely remembered. The build stanza stays on
  # both: dropping it here would turn `docker compose build migrate` into a
  # silent no-op ("No services to build") and send a bare `up -d migrate` off
  # to a registry for an image that only ever exists locally.
  migrate:
    image: confer-gateway:latest
    build:
      context: .
      dockerfile: infra/gateway.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    working_dir: /app/packages/gateway
    environment:
      DATABASE_URL: postgres://confer:${POSTGRES_PASSWORD:-confer}@postgres:5432/confer
    command: ["bun", "run", "src/db/migrate.ts"]
    restart: "no"

  # Single instance by design — WebSocket connections, A2A replay nonces and
  # rate-limit counters all live in this process's memory. Adding a replica
  # would silently break A2A replay protection (a replay routed to the other
  # replica finds an empty nonce table). Scaling out requires moving that state
  # to a shared store first; see docs/02-architecture.md.
  gateway:
    image: confer-gateway:latest
    build:
      context: .
      dockerfile: infra/gateway.Dockerfile
    restart: unless-stopped
    # A local model runtime (Ollama, LM Studio) listens on the owner's own
    # machine, and the gateway is what dials it — both to chat and to list the
    # models the settings UI offers. Docker Desktop resolves this name on its
    # own; Linux does not, and without the mapping the owner's only usable
    # address would be a LAN IP that changes.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_started
      # QDRANT_URL below points at this service, so it belongs here — without
      # it, `up -d gateway client` leaves a stopped qdrant stopped and RAG
      # fails silently. It has no healthcheck, so service_started is as strong
      # a condition as we can state; the gateway retries the connection.
      qdrant:
        condition: service_started
    environment:
      DATABASE_URL: postgres://confer:${POSTGRES_PASSWORD:-confer}@postgres:5432/confer
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # The address peers reach this instance at. Every DID this gateway mints
      # is derived from it, so it is not cosmetic: leave it at localhost and no
      # other instance can resolve this one's identities. Defaults to the host
      # the client container serves on (port 80), NOT the gateway's own 3000.
      # Set it to your domain — including a non-80 EXPOSE_PORT — before
      # federating. Changing it re-hosts identities minted under the old
      # localhost default; see rehostLegacyDids in bootstrap.ts.
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      ADMIN_USERNAMES: ${ADMIN_USERNAMES:-}
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-confer}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-confer-secret}
      MINIO_BUCKET: knowledge-docs

  client:
    image: confer-client:latest
    build:
      context: .
      dockerfile: infra/client.Dockerfile
    restart: unless-stopped
    ports:
      - "${EXPOSE_PORT:-80}:80"
    depends_on:
      - gateway

volumes:
  pgdata:
  qdrantdata:
  miniodata:
