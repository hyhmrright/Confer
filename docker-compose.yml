services:
  # Every port below binds to 127.0.0.1 rather than 0.0.0.0. These are the dev
  # stack's own datastores, reached only from this machine, and they carry the
  # throwaway credentials written into this file — published on every interface
  # they hand any device on the same café or office network an unauthenticated
  # Postgres, an object store and a vector store. Docker publishes to 0.0.0.0 by
  # default and, on Linux, writes the rule straight into the host firewall's
  # NAT table, so a firewall that looks closed is not one.
  postgres:
    image: postgres:18-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: confer
      POSTGRES_PASSWORD: confer
      POSTGRES_DB: confer
    # 18 keeps its data in a major-versioned subdirectory, so the mount moved up
    # one level from /var/lib/postgresql/data. See docker-compose.prod.yml for
    # what that means for a volume written by 16.
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confer"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage

  minio:
    image: minio/minio:latest
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: confer
      MINIO_ROOT_PASSWORD: confer-secret
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  qdrantdata:
  miniodata:
